# Optional override for an ALREADY RUNNING Telegram Local Bot API deployment.
# This file does not create or start that server. Create the external network
# separately, attach the Local Bot API service to it, and configure its service
# URL below. The large-file ceiling activates only after Telegram getMe succeeds
# through this transport.
services:
  bot:
    environment:
      USE_LOCAL_API: "true"
      LOCAL_API_BASE_URL: ${TELEGRAM_LOCAL_API_BASE_URL:-http://telegram-local-api:8081}
    networks:
      - default
      - telegram_local_api

networks:
  telegram_local_api:
    external: true
    name: ${TELEGRAM_LOCAL_API_NETWORK:?Set TELEGRAM_LOCAL_API_NETWORK}
